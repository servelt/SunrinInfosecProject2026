<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occulta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&family=Noto+Sans+KR:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap">
<style>
:root{--ink:#F5F5F7;--dim:#9A9AA0;--faint:#6B6B72;--line:rgba(255,255,255,.08);--green:#6EF0A8;--yellow:#FFD66B;--red:#FF7A7A;--pink:#FFB3B3}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--ink);font-family:Sora,'Noto Sans KR',system-ui,sans-serif;font-weight:300;font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.space{min-height:100vh;display:flex;background-color:#000;background-image:
radial-gradient(1px 1px at 37px 61px,rgba(255,255,255,.85),transparent 60%),radial-gradient(1px 1px at 181px 23px,rgba(255,255,255,.5),transparent 60%),
radial-gradient(1px 1px at 251px 199px,rgba(255,255,255,.7),transparent 60%),radial-gradient(1px 1px at 97px 241px,rgba(255,255,255,.4),transparent 60%),
radial-gradient(1.5px 1.5px at 411px 147px,rgba(255,255,255,.9),transparent 60%),radial-gradient(1px 1px at 333px 389px,rgba(255,255,255,.45),transparent 60%),
radial-gradient(1px 1px at 521px 311px,rgba(255,255,255,.6),transparent 60%),radial-gradient(1px 1px at 619px 77px,rgba(255,255,255,.35),transparent 60%),
radial-gradient(2px 2px at 703px 457px,rgba(255,255,255,.9),transparent 60%),radial-gradient(1px 1px at 151px 503px,rgba(255,255,255,.55),transparent 60%);
background-size:293px 293px,293px 293px,293px 293px,293px 293px,523px 523px,523px 523px,523px 523px,811px 811px,811px 811px,811px 811px;background-attachment:fixed}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,214,107,.55),0 0 12px rgba(255,214,107,.8)}100%{box-shadow:0 0 0 12px rgba(255,214,107,0),0 0 12px rgba(255,214,107,.8)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 1.8s ease-out infinite}.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.fade{animation:fade .5s ease both}
@media (prefers-reduced-motion:reduce){.pulse,.rise,.fade{animation:none}}
.hov:hover{background:rgba(255,255,255,.06)}
[hidden]{display:none !important}
.icon{width:36px;height:36px;border:0;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center}
aside{width:236px;flex:none;min-height:100vh;padding:14px 10px;border-right:1px solid var(--line);background:rgba(10,10,12,.72);display:flex;flex-direction:column;gap:14px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto}
.brand{font-family:Sora,sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.34em;text-shadow:0 0 16px rgba(255,255,255,.6)}
.newscan{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid3 input{font-size:13px}
.seg-s button{font-size:12.5px;padding:6px 14px}
.updnote{position:fixed;top:14px;right:18px;z-index:5;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:6px 14px;cursor:pointer;box-shadow:0 0 16px rgba(255,255,255,.25)}
.updnote.bad{color:var(--pink);border-color:rgba(255,179,179,.35);box-shadow:none;cursor:default}
.tchip{border:0;background:transparent;color:var(--dim);font-size:11.5px;cursor:pointer;padding:2px 8px;border-radius:999px}.tchip:hover{color:#fff;background:rgba(255,255,255,.06)}
.pstop{margin-top:6px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:transparent;color:var(--dim);font-size:12px;padding:5px 16px;cursor:pointer}.pstop:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.ver{margin-top:auto;padding:10px 12px 4px;font-size:11px;color:var(--faint);display:flex;flex-direction:column;gap:6px}
.ver button{align-self:flex-start;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:transparent;color:#fff;font-size:11.5px;padding:4px 12px;cursor:pointer;box-shadow:0 0 12px rgba(255,255,255,.18)}
.srow{position:relative}.srow .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:7px;background:transparent;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,background .15s;cursor:pointer}
.srow:hover .del,.srow .del:focus-visible{opacity:1}.srow .del:hover{background:rgba(255,122,122,.14)}.srow .del:hover svg{stroke:var(--red)}
.sess{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:4px 38px 4px 10px;border:0;border-radius:8px;background:transparent;text-align:left}
.sess.on{background:rgba(255,255,255,.08)}
.sess .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sess .s{font-size:11px;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
main{flex:1;min-width:0;position:relative;min-height:100vh}
.menu{position:absolute;top:12px;left:12px;z-index:3}
.home{max-width:520px;margin:0 auto;padding:80px 24px 72px;display:flex;flex-direction:column;gap:28px}
h1.big{margin:0;font-weight:200;font-size:40px;line-height:1.1;letter-spacing:-.02em;text-shadow:0 0 40px rgba(255,255,255,.35);text-align:center}
.sub{margin:0;color:var(--dim);text-align:center}
.seg{display:flex;padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.14);align-self:center}
.seg button{min-height:34px;padding:0 20px;border:0;border-radius:999px;font-size:13px;color:var(--dim);background:transparent}
.seg button.on{color:#000;background:#fff;box-shadow:0 0 22px rgba(255,255,255,.35)}
label.f{display:flex;flex-direction:column;gap:8px}
label.f span{font-size:11px;letter-spacing:.18em;color:var(--dim)}
label.f input{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.22);padding:6px 0 9px;color:#fff;font-size:16px;font-weight:300;font-family:Sora,sans-serif;border-radius:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:18px 24px}
.hint{font-size:12.5px;color:var(--dim)}.hint.bad{color:var(--pink)}
.commits{max-height:260px;overflow-y:auto;border-top:1px solid rgba(255,255,255,.1)}
.commit{display:flex;align-items:center;gap:12px;width:100%;min-height:30px;padding:0 6px;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;font-size:12.5px;color:var(--dim);text-align:left}
.commit.on{color:#fff}.commit .h{font-family:'JetBrains Mono',monospace;font-size:12px;width:58px;flex:none}
.commit .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.commit .d{font-size:12px;flex:none}
.start{align-self:center;min-width:180px;min-height:42px;padding:0 28px;border:0;border-radius:999px;font-size:14px;letter-spacing:.04em;background:#fff;color:#000;box-shadow:0 0 36px rgba(255,255,255,.35),0 0 4px rgba(255,255,255,.8)}
.start:disabled{background:rgba(255,255,255,.12);color:var(--faint);box-shadow:none;cursor:not-allowed}
.prep{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px}
.bar{width:min(400px,80vw);height:2px;border-radius:2px;background:rgba(255,255,255,.1);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.95),0 0 28px rgba(255,255,255,.45);transition:width .9s linear}
.err{max-width:560px;color:var(--pink);font-size:14px;text-align:center}
.flow{position:relative;padding:18px 0 60px}
.title{text-align:center;font-size:12px;letter-spacing:.32em;color:var(--dim);padding-bottom:12px;display:flex;justify-content:center;gap:14px;align-items:center}
.title button{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:999px;font-size:11.5px;letter-spacing:.1em;color:var(--dim);padding:4px 12px}
.col{width:36%;max-width:440px;display:flex;flex-direction:column;transition:margin-left .7s cubic-bezier(.2,.8,.2,1) .22s;margin-left:32%}
.col.shift{margin-left:60%;transition-delay:0s}
.box{display:flex;flex-direction:column;gap:4px;padding:10px 14px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.55);transition:border-color .6s,box-shadow .6s}
.box.started{border-color:rgba(110,240,168,.65);box-shadow:0 0 28px rgba(110,240,168,.16),inset 0 0 24px rgba(110,240,168,.05)}
.box .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.box .bt{font-family:Sora,sans-serif;font-weight:300;font-size:14px;letter-spacing:.02em;color:var(--faint)}
.box .bs{font-size:10.5px;letter-spacing:.16em;color:var(--faint)}
.box.started .bt{color:var(--green);text-shadow:0 0 16px rgba(110,240,168,.5)}.box.started .bs{color:var(--green)}
.box .ctx{font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.arrow{display:flex;justify-content:center;padding:2px 0}
.node{display:grid;grid-template-columns:minmax(0,1fr) 9px minmax(0,1fr);align-items:center;width:100%;height:22px;padding:0;border:0;background:transparent}
.node .mid{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.node .ln{flex:1;width:1px;background:rgba(255,255,255,.16)}.node .ln.ok{background:rgba(110,240,168,.75);box-shadow:0 0 6px rgba(110,240,168,.7)}.node .ln.none{background:transparent}
.node .d{width:6px;height:6px;border-radius:50%;flex:none;border:1px solid var(--faint)}
.node .nm{grid-column:3;grid-row:1;padding-left:10px;text-align:left;white-space:nowrap;font-size:12px;color:var(--faint)}
.node.left .nm{grid-column:1;padding-left:0;padding-right:10px;text-align:right}
.node:hover .nm{text-decoration:underline;text-underline-offset:4px}
.node.done .d{border:0;background:var(--green);box-shadow:0 0 10px var(--green)}.node.done .nm{color:var(--green)}
.node.run .d{border:0;background:var(--yellow)}.node.run .nm{color:var(--yellow)}
.node.fail .d{border:0;background:var(--red);box-shadow:0 0 10px var(--red)}.node.fail .nm{color:var(--red)}
.node.on .d{box-shadow:0 0 10px currentColor,0 0 0 5px rgba(255,255,255,.14)}.node.on .nm{text-shadow:0 0 12px rgba(255,255,255,.45)}
.branch{position:relative;height:16px}
.branch .st{position:absolute;left:50%;width:1px;height:7px;background:rgba(255,255,255,.16)}
.branch .ar{position:absolute;left:25%;right:25%;height:10px;border:1px solid rgba(255,255,255,.16)}
.branch.fork .st{top:0}.branch.fork .ar{top:6px;border-bottom:0;border-radius:9px 9px 0 0}
.branch.join .ar{top:0;border-top:0;border-radius:0 0 9px 9px}.branch.join .st{top:9px}
.branch.ok .st{background:rgba(110,240,168,.75);box-shadow:0 0 6px rgba(110,240,168,.7)}.branch.ok .ar{border-color:rgba(110,240,168,.75);filter:drop-shadow(0 0 4px rgba(110,240,168,.7))}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.lane{display:flex;flex-direction:column}
.fill{flex:1;min-height:6px;width:1px;align-self:center;background:rgba(255,255,255,.16)}.fill.ok{background:rgba(110,240,168,.75);box-shadow:0 0 6px rgba(110,240,168,.7)}
.cube{align-self:center;display:flex;justify-content:center;background:transparent;border:0;padding:4px 20px}
.cube svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.85)) drop-shadow(0 0 18px rgba(255,255,255,.35));opacity:.4;transition:opacity .5s}
.cube.ready svg{opacity:1}
.panel{position:absolute;top:44px;left:3%;width:52%;display:flex;flex-direction:column;gap:8px;transition:opacity .2s ease,transform .2s ease;opacity:0;transform:translateX(-24px);pointer-events:none}
.panel.show{opacity:1;transform:none;pointer-events:auto;transition:opacity .5s ease .15s,transform .6s cubic-bezier(.2,.8,.2,1)}
.panel .grp{font-size:10.5px;letter-spacing:.3em;color:var(--dim)}
.panel h2{margin:0;font-weight:200;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.panel .now{margin:0;color:var(--yellow);font-size:13px;text-shadow:0 0 14px rgba(255,214,107,.45)}
.panel pre{margin:0;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,214,107,.3);background:rgba(255,214,107,.04);font-family:'JetBrains Mono',monospace;font-weight:300;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.panel pre.doc{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.03);max-height:60vh;overflow:auto;font-size:12.5px;line-height:1.65}
.panel .sum{margin:0;color:#D8D8DC;font-size:13.5px}
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) auto;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.r .a{font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow-wrap:anywhere}.r .b{font-size:12.5px;color:var(--dim);overflow-wrap:anywhere}.r .c{font-size:11.5px;text-align:right;white-space:nowrap}
.rows.scroll{max-height:calc(100vh - 250px);overflow-y:auto;padding-right:6px}
.rows.list .r{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:10px;padding:0;line-height:1.5;border-bottom:0}
.rows.list .a{font-size:11.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows.list .b{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows.list .c{font-size:11px}
.rows.groups .r{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:4px 0}
.rows.groups .gn{display:block;font-size:12.5px;color:#fff}.rows.groups .gd{display:block;font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:1px}
.secs{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 250px);overflow-y:auto;padding-right:6px}
.sec .sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.sec .gn{display:block;font-size:12.5px;color:#fff}.sec .gd{display:block;font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:1px}
.sec .cnt{font-size:11px;color:var(--dim);margin-left:8px}
.sec .rows.list{margin-top:4px;padding-left:10px;border-left:1px solid var(--line)}
.ok{color:var(--green)}.no{color:var(--dim)}.warn{color:var(--yellow)}.hi{color:var(--red)}.midc{color:var(--pink)}
.x{position:absolute;top:-6px;right:0}
@media (max-width:900px){.col,.col.shift{width:92%;margin-left:4%}.panel{position:static;width:92%;margin:0 4% 24px;transform:none}.panel:not(.show){display:none}}
</style>
</head>
<body>
<div class="space" id="app">
<aside id="side" hidden>
<div style="display:flex;justify-content:space-between;align-items:center">
<button class="icon" id="menu2" aria-label="기록 닫기"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F5F5F7" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
<span class="brand">OCCULTA</span>
</div>
<button class="newscan hov" id="newscan"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#F5F5F7" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M9 3v12M3 9h12"/></svg><span>새 스캔</span></button>
<div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:11.5px;letter-spacing:.24em;color:var(--dim);padding:0 12px 8px">기록</span><div id="slist"></div></div>
<div class="ver" id="ver"></div>
</aside>
<button class="updnote" id="updnote" hidden></button>
<main id="main">
<button class="icon menu" id="menu" aria-label="기록 열기"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#F5F5F7" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
<div id="view"></div>
</main>
</div>
<script>
const NAMES = {eg:'Entry Generator',ev:'Entry Verifier',cg:'Context Grouping',ig:'Input Generator',hg:'Harness Generator',hv:'Harness Verifier',
  tm:'Threat Model',dr:'Direction',spg:'SP Generator',spv:'SP Verifier',pov:'PoV',inv:'Invariant 삽입',fz:'Fuzzing',ct:'Crash Triage',val:'Validation',adv:'Advisory'};
const HC = ['eg','ev','cg','ig','hg','hv'];
const VR = ['tm','dr','spg','spv','pov','inv','fz','ct','val','adv'];
const COL = {done:'#6EF0A8',run:'#FFD66B',wait:'#6B6B72',fail:'#FF7A7A',prep:'#FFD66B',stop:'#9A9AA0',stopped:'#9A9AA0',failed:'#FF7A7A'};
const PHASE = {prep:'준비 중',run:'진행 중',done:'완료',stopped:'중단',failed:'실패'};
const S = {sidebar:false, view:'home', sid:null, sel:null, sessions:[], status:null, flowFor:null, doc:null,
  form:{mode:'full', provider:'claude', models:null, repo:'', branch:'', hours:'3', commit:'', commits:[], cmsg:''}};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const d = await r.json().catch(() => ({error:'bad response'}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

// ---------------------------------------------------------------- sidebar
function setSidebar(open) { S.sidebar = open; $('side').hidden = !open; $('menu').hidden = open; }
$('menu').onclick = () => setSidebar(true); $('menu2').onclick = () => setSidebar(false);
$('newscan').onclick = () => { S.view = 'home'; S.sid = null; renderView(); renderSessions(); };
function renderSessions() {
  $('slist').innerHTML = S.sessions.map(s => {
    const c = COL[s.phase] || '#9A9AA0', live = s.phase === 'run' || s.phase === 'prep';
    const dot = s.phase === 'stopped' ? `border:1px solid ${c}` : `background:${c};box-shadow:0 0 8px ${c}`;
    return `<div class="srow"><button class="sess hov ${S.view==='session'&&S.sid===s.id?'on':''}" data-id="${esc(s.id)}"><span class="dot ${live?'pulse':''}" style="${dot}"></span>
      <span style="display:flex;flex-direction:column;min-width:0"><span class="t">${esc(s.name)} ${esc(s.rev)}</span><span class="s">${esc(s.mode)} · ${esc(s.when)} · ${PHASE[s.phase]||s.phase}</span></span></button><button class="del" data-id="${esc(s.id)}" aria-label="세션 삭제" title="삭제"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#9A9AA0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.5h6.6L12 4M6.8 6.8v4.4M9.2 6.8v4.4"/></svg></button></div>`;
  }).join('') || `<p style="color:var(--dim);font-size:13px;padding:0 12px">아직 기록 없음</p>`;
  for (const b of $('slist').querySelectorAll('.sess')) b.onclick = () => openSession(b.dataset.id);
  for (const b of $('slist').querySelectorAll('.del')) b.onclick = (e) => { e.stopPropagation(); deleteSession(b.dataset.id); };
}
async function loadVersion() {
  try {
    const v = await api('/api/version'), el = $('ver');
    el.innerHTML = `<span>${esc(v.current || v.version)}</span>` + (v.update ? `<button id="upd">업데이트 ${esc(v.latest)}</button>` : '');
    const note = $('updnote');
    const run = async (btn) => {
      if (!confirm(`${v.latest} 로 업데이트할까? 서버가 잠깐 다시 시작돼.`)) return;
      btn.disabled = true; btn.textContent = '업데이트 중…';
      try { await api('/api/update', {}); setTimeout(() => location.reload(), 4000); }
      catch (e) { alert('업데이트 못 함: ' + e.message); loadVersion(); }
    };
    if (v.update) { $('upd').onclick = () => run($('upd')); note.hidden = false; note.className = 'updnote'; note.textContent = `새 버전 ${v.latest} · 업데이트`; note.onclick = () => run(note); }
    else if (v.check_error) { note.hidden = false; note.className = 'updnote bad'; note.textContent = '업데이트 확인 실패 (GitHub 인증)'; note.title = v.check_error; note.onclick = null; }
    else note.hidden = true;

loadVersion();
setInterval(loadVersion, 5 * 60 * 1000);
async function deleteSession(id) {

  try { await api(`/api/sessions/${encodeURIComponent(id)}/delete`, {}); } catch (e) { alert('삭제 못 함: ' + e.message); return; }

async function loadSessions() { try { const d = await api('/api/sessions'); S.sessions = d.sessions; S.profiles = d.profiles; renderSessions(); } catch (e) {} }

// ---------------------------------------------------------------- home

// Defaults per back end (fbaugur/config.py PROVIDER_MODELS): reasoning / main / fast tiers.
const PROVIDERS = [

  {id:'codex', label:'Codex', models:{1:'gpt-6-sol', 2:'gpt-6-sol', 3:'gpt-6-luna'}},

const TIERS = ['REASONING', 'MAIN', 'FAST'];
function tierModels() { const f = S.form; return f.models || (PROVIDERS.find(p => p.id === f.provider) || PROVIDERS[0]).models; }
function updateHomeBits() {

function renderCommits() {

async function loadCommits() {
  const f = S.form; if (f.mode !== 'delta') return;

  try { const d = await api(`/api/commits?repo=${encodeURIComponent(f.repo)}&branch=${encodeURIComponent(f.branch)}`); f.commits = d.commits; f.cmsg = d.commits.length ? '' : '커밋 없음';
    if (!d.commits.some(c => c.hash === f.commit)) f.commit = ''; }
  catch (e) { f.commits = []; f.cmsg = '불러오지 못함: ' + e.message; }

}
async function startScan() {
  const f = S.form; $('start').disabled = true; $('serr').textContent = '';
  try { const d = await api('/api/scan', {repo:f.repo, branch:f.branch, mode:f.mode, commit:f.commit, hours:f.hours, provider:f.provider}); await loadSessions(); openSession(d.id); }
  catch (e) { $('serr').textContent = e.message; updateHomeBits(); }

// ---------------------------------------------------------------- session
function renderView() {
  if (S.view === 'home') return renderHome();
  const st = S.status;
  if (!st) { $('view').innerHTML = `<div class="prep"><span class="hint">불러오는 중…</span></div>`; return; }
  if (st.phase === 'prep' || st.phase === 'failed' && !Object.values(st.status).some(v => v !== 'wait')) return renderPrep(st);
  if (S.flowFor !== st.id) buildFlow(st);
  updateFlow(st);
}
function timeText(st) {
  if (st.hours === -1 || st.hours === '-1') return '시간 제한 없음 · 바꾸기';
  if (!st.ends_at) return st.hours ? `${st.hours}시간 · 바꾸기` : '';
  const left = Math.max(0, st.ends_at - Date.now() / 1000), h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60);
  return `남은 시간 ${h}시간 ${m}분 · 바꾸기`;
}
async function changeHours(st) {
  const v = prompt('전체 시간 제한 (시간, 스캔 시작부터). -1 이면 제한 없음', String(st.hours ?? 3));
  if (v === null) return;
  try { await api(`/api/sessions/${encodeURIComponent(st.id)}/hours`, {hours: v.trim()}); poll(); }
  catch (e) { alert('못 바꿈: ' + e.message); }
}
function renderPrep(st) {
  S.flowFor = null;
  if (!$('prepbar')) $('view').innerHTML = `<div class="prep fade"><span id="pname" style="font-size:12px;letter-spacing:.32em;color:var(--dim)"></span>
    <div class="bar"><i id="prepbar" style="width:0%"></i></div>
    <div style="display:flex;justify-content:space-between;width:min(400px,80vw);font-size:12px;color:var(--dim)"><span id="plabel"></span><span id="ppct" style="color:var(--ink)"></span></div>
    <p class="err" id="perr"></p><button class="tchip" id="ptime"></button><button class="pstop" id="pstop" hidden>중지</button></div>`;
  $('pname').textContent = `${st.name} ${st.rev}`.toUpperCase();
  const shown = Math.max(S.prepShown?.[st.id] || 0, st.prep.progress);
  S.prepShown = {...(S.prepShown||{}), [st.id]: shown};
  $('prepbar').style.width = (shown * 100).toFixed(1) + '%';
  $('plabel').textContent = st.phase === 'failed' ? '준비 실패' : st.prep.label;
  $('ppct').textContent = Math.floor(shown * 100) + '%';
  $('perr').textContent = st.error || '';
  const pt = $('ptime'); pt.textContent = st.phase === 'prep' ? timeText(st) : ''; pt.onclick = () => changeHours(st);
  const stop = $('pstop');
  stop.hidden = st.phase !== 'prep';
  stop.onclick = async () => { if (confirm('준비를 멈출까?')) { stop.disabled = true; await api(`/api/sessions/${encodeURIComponent(st.id)}/stop`, {}); poll(); } };
}
// slowly creep the bar between milestones so it never looks frozen
setInterval(() => {
  const st = S.status; if (!st || st.phase !== 'prep' || !$('prepbar')) return;
  const cap = Math.min(0.99, st.prep.progress + 0.06), cur = S.prepShown?.[st.id] || 0;
  if (cur < cap) { S.prepShown[st.id] = cur + 0.002; $('prepbar').style.width = (S.prepShown[st.id]*100).toFixed(1) + '%'; $('ppct').textContent = Math.floor(S.prepShown[st.id]*100) + '%'; }
}, 400);

const ARROW = (id) => `<div class="arrow"><svg width="12" height="18" viewBox="0 0 12 18" fill="none" aria-hidden="true"><path id="${id}" d="M6 0v15M2 11l4 5 4-5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/></svg></div>`;
function nodeHtml(id, side, i) {
  return `<button class="node ${side||''} rise" id="n-${id}" data-id="${id}" style="animation-delay:${(i*0.08).toFixed(2)}s">
    <span style="grid-column:${side==='left'?3:1};grid-row:1"></span>
    <span class="mid"><span class="ln" id="li-${id}"></span><span class="d" id="d-${id}"></span><span class="ln" id="lo-${id}"></span></span>
    <span class="nm">${NAMES[id]}</span></button>`;
}
function buildFlow(st) {
  S.flowFor = st.id; let i = 0;
  const seq = (ids, side) => ids.map(id => nodeHtml(id, side, i++)).join('');
  $('view').innerHTML = `<div class="flow">
    <div class="title"><span id="ftitle"></span><button id="ftime" class="tchip" title="시간 제한 바꾸기"></button><button id="fstop" hidden>중지</button></div>
    <section class="panel" id="panel" aria-hidden="true"></section>
    <div class="col" id="col">
      <div class="box" id="b-hc"><div class="hd"><span class="bt">Harness Create</span><span class="bs" id="bs-hc"></span></div><div style="display:flex;flex-direction:column">${seq(HC)}</div></div>
      ${ARROW('ar-vr')}
      <div class="box" id="b-vr"><div class="hd"><span class="bt">Vulnerability Research</span><span class="bs" id="bs-vr"></span></div><span class="ctx" id="vctx"></span>
        <div style="display:flex;flex-direction:column">${seq(['tm','dr'])}
          <div class="branch fork" id="fork"><span class="st"></span><span class="ar"></span></div>
          <div class="lanes"><div class="lane">${seq(['spg','spv','pov'],'left')}<span class="fill" id="fillA"></span></div><div class="lane">${seq(['inv','fz'])}<span class="fill" id="fillB"></span></div></div>
          <div class="branch join" id="join"><span class="ar"></span><span class="st"></span></div>
          ${seq(['ct','val','adv'])}</div></div>
      ${ARROW('ar-out')}
      <button class="cube" id="cube" aria-label="산출물"><svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true"><path d="M16 3l12 7v12l-12 7-12-7V10z"/><path d="M4 10l12 7 12-7M16 17v12"/></svg></button>
    </div></div>`;
  for (const b of document.querySelectorAll('.node')) b.onclick = () => { S.sel = S.sel === b.dataset.id ? null : b.dataset.id; S.doc = null; updateFlow(S.status); };
  $('cube').onclick = () => { S.sel = S.sel === 'out' ? null : 'out'; S.doc = null; updateFlow(S.status); };
  $('fstop').onclick = async () => { if (confirm('이 스캔을 멈출까?')) { await api(`/api/sessions/${S.sid}/stop`, {}); poll(); } };
}
function updateFlow(st) {
  if (!st || S.flowFor !== st.id) return;
  const s = st.status, done = (id) => s[id] === 'done';
  $('ftitle').textContent = `${st.name} ${st.rev} · ${st.mode} · ${PHASE[st.phase] || st.phase}`;
  { const ft = $('ftime'); ft.textContent = st.phase === 'run' ? timeText(st) : ''; ft.onclick = () => changeHours(st); }
  $('fstop').hidden = !(st.phase === 'run' && S.sessions.find(x => x.id === st.id && !/pipeline$/.test(x.id)));
  for (const id of [...HC, ...VR]) {
    const n = $('n-' + id); n.className = `node rise ${n.classList.contains("left")?"left":""} ${s[id]} ${S.sel===id?"on":""}`;
    $('d-' + id).className = 'd' + (s[id] === 'run' ? ' pulse' : '');
  }
  const line = (el, ok) => { el.className = 'ln' + (ok === null ? ' none' : ok ? ' ok' : ''); };
  const chain = (ids, firstIn, lastOut) => ids.forEach((id, k) => { line($('li-'+id), k === 0 ? firstIn : done(ids[k-1])); line($('lo-'+id), k === ids.length-1 ? lastOut : done(id)); });
  const forkOk = done('dr'), joinOk = s.ct !== 'wait';
  chain(HC, null, null); chain(['tm','dr'], null, forkOk); chain(['spg','spv','pov'], forkOk, done('pov')); chain(['inv','fz'], forkOk, done('fz')); chain(['ct','val','adv'], joinOk, null);
  $('fork').className = 'branch fork' + (forkOk ? ' ok' : ''); $('join').className = 'branch join' + (joinOk ? ' ok' : '');
  $('fillA').className = 'fill' + (done('pov') ? ' ok' : ''); $('fillB').className = 'fill' + (done('fz') ? ' ok' : '');
  for (const [box, ids, arrow] of [['hc', HC, null], ['vr', VR, 'ar-vr']]) {
    const started = ids.some(id => s[id] !== 'wait'), all = ids.every(id => s[id] === 'done');
    $('b-' + box).className = 'box' + (started ? ' started' : ''); $('bs-' + box).textContent = all ? '완료' : started ? '진행 중' : '대기';
    if (arrow) $(arrow).setAttribute('stroke', started ? 'rgba(110,240,168,0.7)' : 'rgba(255,255,255,0.2)');
  }
  $('vctx').textContent = st.context || '';
  const ready = st.outputs.length > 0; $('cube').className = 'cube' + (ready ? ' ready' : '');
  $('col').className = 'col' + (S.sel ? ' shift' : '');
  renderPanel(st);
}
const TAG = {ok:'ok', no:'no', warn:'warn', hi:'hi', mid:'midc'};
function rowsHtml(d) {
  if (d.layout === 'sections') return `<div class="secs">` + (d.sections||[]).map(x =>
    `<div class="sec"><div class="sh"><span><span class="gn">${esc(x.title)}<span class="cnt">${esc(x.count)}</span></span>${x.desc ? `<span class="gd">${esc(x.desc)}</span>` : ''}</span><span class="c ${TAG[x.tag]||''}" style="font-size:11.5px">${esc(x.state)}</span></div>` +
    (x.rows.length ? rowsHtml({layout:'list', rows:x.rows}).replace('rows list scroll','rows list') : '') + `</div>`).join('') + `</div>`;
  if (d.layout === 'groups') return `<div class="rows groups scroll">` + d.rows.map(r =>
    `<div class="r"><span><span class="gn">${esc(r.a)}</span>${r.b ? `<span class="gd">${esc(r.b)}</span>` : ''}</span><span class="c ${TAG[r.t]||''}">${esc(r.c)}</span></div>`).join('') + `</div>`;
  const cls = d.layout === 'list' ? 'rows list scroll' : 'rows';
  return `<div class="${cls}">` + d.rows.map(r => `<div class="r"><span class="a" title="${esc(r.a)}">${esc(r.a)}</span><span class="b" title="${esc(r.b)}">${esc(r.b)}</span><span class="c ${TAG[r.t]||''}">${esc(r.c)}</span></div>`).join('') + `</div>`;
}
function renderPanel(st) {
  const p = $('panel'); p.className = 'panel' + (S.sel ? ' show' : ''); p.setAttribute('aria-hidden', S.sel ? 'false' : 'true');
  if (!S.sel) return;
  let html = '';
  if (S.sel === 'out') {
    html = `<span class="grp">OUTPUT</span><h2>산출물</h2>` + (st.outputs.length ? `<div class="rows">` + st.outputs.map((o, k) => {
      const tag = o.verdict === 'VULNERABILITY' ? ((o.score||0) >= 7 ? 'hi' : 'midc') : o.verdict === 'NEEDS_REVIEW' ? 'warn' : 'no';
      return `<button class="r" data-k="${k}"><span class="a">${esc(o.score ?? '')}  ${esc((o.type||'').slice(0,40))}</span><span class="b">${esc(o.title)}</span><span class="c ${tag}">${esc(o.verdict.replace(/_/g,' ').toLowerCase())}</span></button>`;
    }).join('') + `</div>` : `<p class="sum">아직 없음</p>`) + (S.doc ? `<pre class="doc">${esc(S.doc)}</pre>` : '');
  } else {
    const d = st.details[S.sel] || {rows:[]}, s = st.status[S.sel];
    const status = {done:'완료', run:'진행 중', wait:'대기', fail:'실패'}[s];
    html = `<span class="grp">${HC.includes(S.sel) ? 'HARNESS CREATE' : 'VULNERABILITY RESEARCH'}</span><h2>${NAMES[S.sel]}</h2>
      <span style="font-size:12px;letter-spacing:.16em;color:${COL[s]}">${status}</span>
      ${s === 'run' && d.now ? `<p class="now">${esc(d.now)}</p>` : ''}
      ${s === 'run' && d.bytes ? `<pre>${esc(d.bytes)}</pre>` : ''}
      ${s !== 'run' && d.summary ? `<p class="sum">${esc(d.summary)}</p>` : s === 'wait' ? `<p class="sum">아직 시작 안 함</p>` : ''}
      ${s === 'wait' ? '' : rowsHtml(d)}`;
  }
  html = `<button class="icon x" id="pclose" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9A9AA0" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button>` + html;
  if (p.dataset.last !== html) { p.innerHTML = html; p.dataset.last = html;
    $('pclose').onclick = () => { S.sel = null; S.doc = null; updateFlow(S.status); };
    for (const b of p.querySelectorAll('button.r')) b.onclick = async () => {
      const o = st.outputs[+b.dataset.k]; if (!o.path) return;
      try { const r = await fetch(`/api/file?session=${encodeURIComponent(st.id)}&path=${encodeURIComponent(o.path)}`); S.doc = await r.text(); } catch (e) { S.doc = String(e); }
      renderPanel(S.status);
    };
  }
}
async function poll() {
  if (S.view !== 'session' || !S.sid) return;
  const sid = S.sid;
  try { const st = await api(`/api/sessions/${encodeURIComponent(sid)}`); if (S.sid !== sid) return; S.status = st; renderView(); }
  catch (e) { if (!S.status) $('view').innerHTML = `<div class="prep"><p class="err">${esc(e.message)}</p></div>`; }
}
setInterval(poll, 1500); setInterval(loadSessions, 4000);
loadSessions(); renderView();
