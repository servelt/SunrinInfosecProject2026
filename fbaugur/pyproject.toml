[project]
name = "fbaugur"
version = "0.1.0"
description = "FuzzingBrain V2 based vulnerability analysis with Code Augur invariant falsification"
requires-python = ">=3.10"

[project.scripts]
occulta = "fbaugur.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fbaugur.web" = ["static/*"]
"fbaugur" = ["prompts/*.md", "prompts/fbv2/*.md"]
